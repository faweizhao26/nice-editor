name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只用内置 token 把产物推到 gh-pages 分支，不依赖第三方 action。
# 注意：不能走 actions/deploy-pages 那套 —— 本仓库的 Pages 是「分支」模式
# （source = gh-pages），configure-pages 会以 "Resource not accessible by
# integration" 失败，因为新建仓库首次开 Pages 需要管理员权限。
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # 项目站点挂在 /<repo>/ 下，必须给 basePath，否则 /_next/... 会 404
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Publish to gh-pages
        # 用孤儿提交覆盖 gh-pages，产物分支不需要历史
        run: |
          cd out
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
